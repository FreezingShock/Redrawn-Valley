<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../../assets/rds/theme.js?v=cad96ff68d"></script><title>Redrawn motif sheet (demo)</title>

<style>
:root{--paper:#f6f1e7;--ink:#1f1d1a;--line:#d9d0bd;--muted:#5c564c}
:root[data-theme="dark"]{--paper:#17120d;--ink:#f3e8d4;--line:#3a2e22;--muted:#cdbfa7;color-scheme:dark}
:root[data-theme="dark"] .m{background:#211a13}:root[data-theme="dark"] .m svg{filter:brightness(.82) saturate(.92)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Hanken Grotesk",system-ui,sans-serif}
header{max-width:1120px;margin:0 auto;padding:32px 24px 8px}h1{font:400 clamp(32px,5vw,48px)/1.05 "Newsreader",Georgia,serif;margin:0 0 8px}
p{color:var(--muted);max-width:62ch;margin:0 0 16px}
.bar{display:flex;gap:8px;flex-wrap:wrap}button{font:600 14px "Hanken Grotesk",sans-serif;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
main{max-width:1120px;margin:0 auto;padding:16px 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:24px}
.m{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fbf8f1}.m svg{display:block;width:100%;height:auto}
.m figcaption{font:13px "IBM Plex Mono",monospace;padding:8px 12px;border-top:1px solid var(--line);color:var(--muted)}
.m svg *{transition:fill 1.2s cubic-bezier(.16,1,.3,1),stroke 1.2s cubic-bezier(.16,1,.3,1)}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.drift svg>g,.drift svg circle:first-of-type{animation:drift 4s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.m svg *{transition:none}.drift svg>g,.drift svg circle:first-of-type{animation:none}}
.e header h1,.e header>p{display:none}.e header{padding-top:16px}
</style></head><body>

const figs=[...document.querySelectorAll('.m')];const orig=figs.map(f=>f.getAttribute('style'));
const pick=()=>ACC[Math.floor(Math.random()*ACC.length)];
