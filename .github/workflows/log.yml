name: Sketchbook log

# After every push to integration, rebuild the Sketchbook log (log/, assets/log.json) and the search index from git history,
# and commit them if they changed. Commits made with GITHUB_TOKEN do not start another run, and a commit that touches only
# generated files never becomes a log entry, so this cannot loop.
on:
  push:
    branches: [integration]

permissions:
  contents: write

concurrency:
  group: sketchbook-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/build_log.py && python3 scripts/build_index.py
      - name: Commit changes
        run: |
          if git diff --quiet; then echo "log is current"; exit 0; fi
          git config user.name "sketchbook-log[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add log assets/log.json assets/search-index.json sitemap.xml robots.txt
          git commit -m "Update Sketchbook log"
          git push
